[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "cohire"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["google-adk[a2a]", "fastapi", "uvicorn", "sqlalchemy[asyncio]", "asyncpg", "alembic", "aiosqlite", "cryptography", "pydantic-settings", "pyjwt[crypto]", "python-multipart", "pypdf", "python-docx", "google-cloud-pubsub", "google-api-python-client", "httpx", "tzdata; platform_system == 'Windows'"]
[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
